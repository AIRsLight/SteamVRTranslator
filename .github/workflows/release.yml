name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath "Directory.Build.props"
          $version = [string]$props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Directory.Build.props does not define Version."
          }

          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match project version '$version'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test and package
        shell: pwsh
        run: ./build.ps1

      - name: Write checksums
        shell: pwsh
        run: |
          $archive = "artifacts/SteamVRTranslator-win-x64.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SteamVRTranslator-win-x64.zip" |
            Set-Content -LiteralPath "artifacts/SHA256SUMS.txt" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamVRTranslator-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/SteamVRTranslator-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $isPrerelease = $tag.Contains("-")
          $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $tagCommit.Trim() -ne $env:GITHUB_SHA) {
            throw "Tag moved while this build was running; refusing to publish stale assets."
          }

          $notesSource = "docs/releases/$tag.md"
          $notesArguments = @()
          if (Test-Path -LiteralPath $notesSource) {
            $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
            $notes = (Get-Content -LiteralPath $notesSource -Raw).TrimEnd()
            Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
            $notesArguments = @("--notes-file", $notesPath)
          }

          $existingJson = gh release view $tag --json isPrerelease,isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (!$isPrerelease -or !$existing.isPrerelease -or $existing.isDraft) {
              throw "Only an existing published prerelease may be overwritten."
            }
            gh release upload $tag `
              "artifacts/SteamVRTranslator-win-x64.zip" `
              "artifacts/SHA256SUMS.txt" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
            gh release edit $tag --prerelease --latest=false --target $env:GITHUB_SHA @notesArguments
            if ($LASTEXITCODE -ne 0) { throw "Release metadata update failed." }
          } else {
            $createArguments = @("--verify-tag", "--title", "SteamVR Translator ${{ steps.version.outputs.version }}")
            if ($isPrerelease) { $createArguments += @("--prerelease", "--latest=false") }
            if ($notesArguments.Count -eq 0) { $notesArguments = @("--generate-notes") }
            gh release create $tag `
              "artifacts/SteamVRTranslator-win-x64.zip" `
              "artifacts/SHA256SUMS.txt" @createArguments @notesArguments
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed." }
          }
